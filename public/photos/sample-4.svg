    <circle cx="750" cy="150" r="134" fill="url(#shine)"/><circle cx="750" cy="150" r="110" fill="#ee4f22"/>
    <circle cx="1045" cy="150" r="134" fill="url(#shine)"/><circle cx="1045" cy="150" r="110" fill="#e3349c"/>
    <circle cx="160" cy="435" r="134" fill="url(#shine)"/><circle cx="160" cy="435" r="110" fill="#ef9c23"/>
    <circle cx="455" cy="435" r="134" fill="url(#shine)"/><circle cx="455" cy="435" r="110" fill="#f0b32a"/>
    <circle cx="750" cy="435" r="134" fill="url(#shine)"/><circle cx="750" cy="435" r="110" fill="#e44528"/>
    <circle cx="1045" cy="435" r="134" fill="url(#shine)"/><circle cx="1045" cy="435" r="110" fill="#dd2493"/>
    <circle cx="160" cy="720" r="134" fill="url(#shine)"/><circle cx="160" cy="720" r="110" fill="#e38428"/>
    <circle cx="455" cy="720" r="134" fill="url(#shine)"/><circle cx="455" cy="720" r="110" fill="#d83524"/>
    <circle cx="750" cy="720" r="134" fill="url(#shine)"/><circle cx="750" cy="720" r="110" fill="#d9274a"/>
    <circle cx="1045" cy="720" r="134" fill="url(#shine)"/><circle cx="1045" cy="720" r="110" fill="#ed2d9b"/>
