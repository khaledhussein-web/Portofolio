<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Color sample photo 4</title>
  <desc id="desc">A high-contrast colorful circular textile-style pattern used as a temporary carousel image.</desc>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dde5ea"/>
      <stop offset=".5" stop-color="#7b8994"/>
      <stop offset="1" stop-color="#3f4a54"/>
    </linearGradient>
    <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 2h8M0 6h8M2 0v8M6 0v8" stroke="#111827" stroke-opacity=".28" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#7c8a94"/>
  <g transform="translate(-100 -90)">
